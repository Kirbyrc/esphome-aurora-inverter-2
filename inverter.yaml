# Aurora inverter monitor package. Include this from a top-level device
# config that supplies esphome: name/friendly_name and your own wifi/api/ota
# settings -- see README.md.
#
# The includes: paths are resolved relative to the ESPHome config directory,
# not this file, so this folder must be named aurora_inverter/ and sit
# directly in the config directory.

esphome:
  includes:
    - aurora_inverter/ABBAuroraStrings.cpp
    - aurora_inverter/ABBAuroraStrings.h
    - aurora_inverter/ABBAuroraEnums.h
    - aurora_inverter/ABBAurora.cpp
    - aurora_inverter/ABBAurora.h
    - aurora_inverter/InverterMonitor.h
  libraries:
    - "Wire"
  on_boot:
    priority: 800.0
    then:
      - lambda: |-
          InverterMonitor::get_instance()->setup();

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino

logger:
  level: INFO

web_server:
  version: 3
  sorting_groups:
    - id: sg_general
      name: "General"
      sorting_weight: 10
    - id: sg_dc
      name: "DC"
      sorting_weight: 20
    - id: sg_grid
      name: "Grid"
      sorting_weight: 30

# NOTE: RS-485 UART (GPIO17/18) and direction control (GPIO21) are owned
# directly by the Aurora library (see aurora_inverter/InverterMonitor.h RX/TX/
# TX_CONTROL_GPIO) via raw Serial2/digitalWrite calls, not by ESPHome's
# uart:/switch: components -- declaring those here would double-claim the
# same physical pins and fight the library for control of them.

# Drives InverterMonitor::update() on a real ESPHome-scheduled loop.
# (InverterMonitor is a plain PollingComponent instantiated at runtime, not
# a codegen-known component, so App never actually calls its loop()/update()
# on its own -- see chat notes.)
interval:
  - interval: 15s
    then:
      - lambda: |-
          InverterMonitor::get_instance()->update();

sensor:
  - platform: template
    update_interval: &default_sensor 30s
    name: "Serial Reset Count"
    id: serial_reset_count
    icon: "mdi:restart-alert"
    accuracy_decimals: 0
    state_class: total_increasing
    entity_category: diagnostic
    web_server:
      sorting_group_id: sg_general
    lambda: |-
      return InverterMonitor::get_instance()->serial_reset_count->state;

  - platform: template
    update_interval: *default_sensor
    name: "Voltage In 1"
    id: v_in_1
    unit_of_measurement: V
    accuracy_decimals: 2
    icon: "mdi:lightning-bolt-outline"
    device_class: voltage
    state_class: measurement
    web_server:
      sorting_group_id: sg_dc
    lambda: |-
      if (InverterMonitor::get_instance()->still_booting()) return {};
      return InverterMonitor::get_instance()->v_in_1;

